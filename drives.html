<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vsd-fault-finder</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b5602f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>

<body>
  <div class="page">
    <div class="top-drive-bar">
      <a id="previous-page" href="javascript:window.history.back();" aria-label="Back to main menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span>Back</span>
      </a>
      <div class="drives-heading">Drives</div>
    </div>

    <div class="select-row">
      <div class="details">
        <div class="select-label" id="vsd-make">Select VSD Make</div>
        <select id="make-input">
          <option value="">Select Make</option>
        </select>
      </div>
      <div class="details">
        <div class="select-label" id="vsd-model">Select VSD Model</div>
        <select id="model-input">
          <option value="">Select Model</option>
        </select>
      </div>

      <div id="error-options">
        <div class="details">
          <div class="select-label" id="vsd-error">Select VSD Error</div>
          <select id="err-input">
            <option value="">Select Error</option>
          </select>
        </div>
        <div class="details">
          <div class="select-label" id="vsd-error-code">Select VSD Error Code</div>
          <select id="errCode-input">
            <option value="">Select Error</option>
          </select>
        </div>
      </div>
    </div>

    <div class="results" id="results">
      <div class="result-box result-box--desc">
        <div class="result-head">Description</div>
        <div id="err-desc"></div>
      </div>
      <div class="result-box result-box--cause">
        <div class="result-head">Cause</div>
        <ul id="err-cause"></ul>
      </div>
      <div class="result-box result-box--solution">
        <div class="result-head">Solution</div>
        <ul id="err-solution"></ul>
      </div>
    </div>
  </div>

  <script src="drives.js"></script>
</body>

</html>
